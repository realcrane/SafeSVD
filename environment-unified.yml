name: physics-unified

channels:
  - conda-forge

dependencies:
  - python=3.11.*
  - pip
  - pip:
      # Match the CUDA/PyTorch stack already shared by all three working envs.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - torchaudio==2.11.0+cu128

      # Shared numerical/data stack. NumPy 1.26 is the conservative choice for
      # Poseidon's older Transformers stack while remaining sufficient for MPP.
      - numpy==1.26.4
      - h5py==3.16.0
      - matplotlib==3.11.1
      - pandas==3.0.5
      - pillow==12.2.0
      - pyyaml==6.0.3
      - tqdm==4.69.1

      # Shared experiment tracking. These versions preserve the older
      # Poseidon/MPP API behaviour used by the code.
      - wandb==0.15.8
      - protobuf==4.25.9
      - psutil==7.2.2

      # Poseidon / scOT.
      - flit-core>=3.2,<4
      - accelerate==0.31.0
      - transformers==4.29.2
      - tokenizers==0.13.3
      - huggingface-hub==0.36.2
      - safetensors==0.8.0
      - netcdf4==1.7.4
      - cftime==1.6.5
      - seaborn==0.13.2

      # VICON.
      - absl-py==2.5.0
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - antlr4-python3-runtime==4.9.3
      - pytz==2026.3.post1
      - tabulate==0.10.0
      - torchinfo==1.8.0

      # Multiple Physics Pretraining (MPP).
      - adan-pytorch==0.1.0
      - dadaptation==3.1
      - einops==0.7.0
      - timm==0.9.5
      - ruamel.yaml==0.17.32
      - ruamel.yaml.clib==0.2.15
      - zarr==2.16.1
      # zarr 2.16 uses APIs removed from newer numcodecs releases.
      - numcodecs==0.11.0
