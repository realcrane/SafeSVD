# Public asset registry for SAFE-SVD v0.
#
# Do not replace the values below with local absolute paths.  Each public
# checkpoint must have a permanent Hugging Face revision and SHA-256 checksum.

schema_version: 1
models:
  poseidon:
    display_name: Poseidon
    implementation: implementations/poseidon/paper/safe_svd.py
    preset: paper
    weights:
      provider: huggingface
      repo_id: camlab-ethz/Poseidon-<MODEL_SIZE>
      revision: TODO_PIN_COMMIT_SHA
      local_subdir: poseidon
      checksum_sha256: TODO_PER_CHECKPOINT
      ownership: upstream
      redistribution: false
    datasets:
      provider: huggingface
      instructions: docs/datasets.md#poseidon

  vicon:
    display_name: VICON
    implementation: implementations/vicon/paper/safe_svd.py
    preset: paper
    weights:
      provider: huggingface
      repo_id: TODO_ORG/SAFE-SVD-VICON
      revision: TODO_PIN_FIRST_PUBLIC_RELEASE_COMMIT
      local_subdir: vicon
      checkpoint_file: TODO_CANONICAL_FILENAME
      checksum_sha256: TODO_SHA256
      ownership: safesvd
      redistribution: true
    datasets:
      provider: upstream
      instructions: docs/datasets.md#vicon

  mpp:
    display_name: Multiple Physics Pretraining (MPP)
    implementation: implementations/mpp/paper/safe_svd.py
    preset: paper
    weights:
      provider: huggingface
      repo_id: TODO_ORG/SAFE-SVD-MPP
      revision: TODO_PIN_FIRST_PUBLIC_RELEASE_COMMIT
      local_subdir: mpp
      checkpoint_file: TODO_CANONICAL_FILENAME
      checksum_sha256: TODO_SHA256
      ownership: safesvd
      redistribution: true
    datasets:
      provider: upstream
      instructions: docs/datasets.md#mpp
