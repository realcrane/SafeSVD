[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-svd"
version = "0.0.0"
description = "Unified routes for reproducible SAFE-SVD compression"
requires-python = ">=3.10"

[project.scripts]
safe-svd = "safesvd.cli:main"
safe-svd-unified = "safe_svd.main:cli_main"

[tool.setuptools.packages.find]
include = ["safesvd*", "safe_svd*", "VICON*", "evaluation*"]

[tool.setuptools.package-data]
safe_svd = ["configs/*.yaml"]
VICON = ["configs/*.yaml", "configs/*/*.yaml", "configs/*.json", "LICENSE", "VENDORED.md"]
